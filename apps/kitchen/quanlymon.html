<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaceLao Bếp - Quản lý Thực đơn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">
                <img src="images/chef.png" alt="HaceLao Chef" onerror="this.style.display='none'">
                <span class="logo-text" style="color: #000; font-size: 18px;">HaceLao Chef</span>
            </div>
            <ul class="nav-links">
                <li><a href="xulymon.html">Đơn hàng</a></li>
                <li class="active"><a href="quanlymon.html">Quản lý thực đơn</a></li>
            </ul>
            <div class="sidebar-user" onclick="showLogoutModal()">
                <img src="../cashier/images/user.png" alt="User">
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarUserName">Nguyễn Văn A</div>
                    <div class="sidebar-user-role">Đầu bếp chính</div>
                </div>
                <span style="margin-left: auto; color: #888; font-weight: bold;">&#8964;</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="background: #F8F9FA;">
            <header class="header" style="display:flex; justify-content:space-between; align-items:center; border-bottom: none; padding-bottom: 0;">
                <h2>Quản lý thực đơn</h2>
                <div class="header-actions" style="display:flex; gap: 15px;">
                    <div class="search-box" style="position:relative;">
                        <input type="text" id="searchInput" placeholder="Tìm kiếm món ăn" style="padding: 8px 35px 8px 15px; border-radius: 20px; border: 1px solid #ccc; outline:none; width: 250px;" oninput="renderMenuManager()">
                        <span style="position:absolute; right: 10px; top: 8px;">🔍</span>
                    </div>
                    <button class="btn btn-orange" style="border-radius:20px; padding: 8px 20px;" onclick="openDailyMenuModal()">+ Cập nhật thực đơn trong ngày</button>
                </div>
            </header>
            
            <div class="filter-bar" style="background: #FFF3E8; padding: 10px 20px; margin: 15px 30px; border-radius: 10px; display:flex; gap: 10px;">
                <button class="filter-btn active" onclick="filterMain('ALL')">Tất cả</button>
                <button class="filter-btn" onclick="filterMain('DM_NL')">Nước lẩu</button>
                <button class="filter-btn" onclick="filterMain('DM_MC')">Món chính</button>
                <button class="filter-btn" onclick="filterMain('DM_NC')">Nước chấm</button>
                <button class="filter-btn" onclick="filterMain('DM_DAV')">Đồ ăn vặt</button>
                <button class="filter-btn" onclick="filterMain('DM_TU')">Đồ uống</button>
            </div>
            
            <div class="menu-manager-grid" id="menuGrid" style="display: flex; flex-wrap: wrap; gap: 20px; padding: 0 30px; overflow-y: auto; align-items: flex-start; justify-content: flex-start;">
                <!-- Rendered by JS -->
            </div>
        </main>
        
        <!-- Modal Thêm món hằng ngày -->
        <div id="dailyMenuModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index:1000; align-items:center; justify-content:center;">
            <div class="modal-content" style="background: #FDEFE5; width: 450px; height: 85vh; border-radius: 20px; padding: 30px; position: relative; display: flex; flex-direction: column;">
                <button onclick="closeDailyMenuModal()" style="position:absolute; top: 15px; right: 15px; background: #FF6B00; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 10;">X</button>
                
                <h1 id="currentDateTitle" style="margin-top: 0; font-size: 28px; padding-right: 40px;">Ngày 24 tháng 5 năm 2026</h1>
                <h3 style="margin-bottom: 20px;">Vui lòng chọn những món ăn ngày hôm nay?</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div style="font-weight: 600;">Danh sách các món ăn</div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 15px; font-weight: 600; color: #333;">Chọn tất cả:</span>
                        <label class="switch">
                            <input type="checkbox" id="masterToggle" onchange="toggleAllDailyMenuItems(this.checked)">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
                
                <div class="filter-bar" style="display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                    <button class="filter-btn modal-filter active" onclick="filterModal('ALL')">Tất cả</button>
                    <button class="filter-btn modal-filter" onclick="filterModal('DM_NL')">Nước lẩu</button>
                    <button class="filter-btn modal-filter" onclick="filterModal('DM_MC')">Món chính</button>
                    <button class="filter-btn modal-filter" onclick="filterModal('DM_NC')">Nước chấm</button>
                    <button class="filter-btn modal-filter" onclick="filterModal('DM_DAV')">Đồ ăn vặt</button>
                    <button class="filter-btn modal-filter" onclick="filterModal('DM_TU')">Đồ uống</button>
                </div>
                
                <div id="modalItemsList" style="display:flex; flex-direction:column; gap: 10px; overflow-y: auto; flex: 1; padding-right: 5px;">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Logout Modal -->
    <div id="logoutModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px; text-align: center; border-radius: 15px; position: relative;">
            <span class="close" onclick="closeLogoutModal()" style="position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer;">&times;</span>
            <h3 style="margin-bottom: 20px; font-size: 20px; color: #333;">Xác nhận</h3>
            <p style="margin-bottom: 30px; color: #555; font-size: 16px;">Bạn có đồng ý đăng xuất không?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn-orange" style="padding: 10px 40px; border-radius: 25px; font-size: 16px;" onclick="confirmLogout()">Đồng ý</button>
            </div>
        </div>
    </div>

    <script src="js/kitchen.js?v=9"></script>
    <script>
        function showLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
        function confirmLogout() {
            localStorage.removeItem('nhanVienInfo');
            window.location.href = '../login.html';
        }
        
        window.onload = () => {
            let nvInfo = localStorage.getItem('nhanVienInfo');
            if (!nvInfo) {
                window.location.href = '../login.html';
                return;
            }
            try {
                let info = JSON.parse(nvInfo);
                if (info.vaiTro !== 'DauBep') {
                    window.location.href = '../login.html';
                    return;
                }
                document.getElementById('sidebarUserName').innerText = info.tenDangNhap || 'Đầu bếp chính';
            } catch(e) {
                window.location.href = '../login.html';
                return;
            }
            initMenuManager();
        };
    </script>
</body>
</html>
